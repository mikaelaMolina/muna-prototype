<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Muna logo</title>
  <desc id="desc">A bubbly coral letter m followed by a yellow dot.</desc>

  <defs>
    <!-- One continuous stroke. The left side is a curved swoosh (no straight stem):
         it starts as a tail at the bottom-left, sweeps up into the first hump,
         then continues into the second hump and a rounded right foot. -->
    <path id="m-shape" d="M 58 318
             C 118 322, 116 176, 212 170
             C 276 166, 306 214, 306 318
             C 306 214, 336 164, 402 168
             C 482 172, 504 236, 500 318"/>
  </defs>

  <!-- Dark sticker outline (keeps the logo visible on white, blush, or coral) -->
  <use href="#m-shape" transform="translate(0 16)" fill="none" stroke="#1C1C1E"
       stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#m-shape" fill="none" stroke="#1C1C1E"
       stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3D lip (Duolingo-style depth) and letter face -->
  <use href="#m-shape" transform="translate(0 16)" fill="none" stroke="#C4433A"
       stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#m-shape" fill="none" stroke="#E8594F"
       stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shine along the swoosh and the right hump -->
  <path d="M 104 262 C 116 222, 136 196, 170 180" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
        stroke-width="13" stroke-linecap="round"/>
  <path d="M 424 140 C 446 142, 466 152, 480 168" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
        stroke-width="12" stroke-linecap="round"/>

  <!-- The dot: stop and think -->
  <circle cx="618" cy="332" r="57" fill="#1C1C1E"/>
  <circle cx="618" cy="318" r="57" fill="#1C1C1E"/>
  <circle cx="618" cy="332" r="48" fill="#D9B32A"/>
  <circle cx="618" cy="318" r="48" fill="#F7D449"/>
  <path d="M 593 303 A 29 29 0 0 1 612 288" fill="none" stroke="#FFFFFF" stroke-opacity="0.75"
        stroke-width="10" stroke-linecap="round"/>

  <!-- Yellow rays -->
  <g stroke="#F7D449" stroke-linecap="round" stroke-width="12">
    <path d="M 578 150 L 608 116"/>
    <path d="M 612 190 L 654 178"/>
    <path d="M 628 234 L 666 246"/>
  </g>
</svg>
