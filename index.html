<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8594F">
  <meta name="color-scheme" content="light dark">
  <!-- Pick light or dark before the page paints: saved choice first, otherwise the system setting. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('muna-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="description" content="Muna: the AI-ready classroom. See how work was made, check understanding, and grade fairly. Think First, Learn for Real.">
  <title>Muna · Think First, Learn for Real</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <!-- Web font (falls back to Segoe UI / system fonts when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" id="brand" href="#/"><img src="assets/wordmark.svg" alt="Muna home"></a>
    <nav class="navlinks" id="navlinks" aria-label="Main"></nav>
    <div class="navright" id="navright"></div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <footer class="footer">Muna · Think First, Learn for Real</footer>

  <dialog id="dlg" aria-modal="true"><div class="dlg" id="dlgBody"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:20px">Muna needs JavaScript turned on.</p></noscript>

  <!-- Order matters: helpers, data, content, logic, screens, then the router boots. -->
  <script src="js/util.js?v=5"></script>
  <script src="js/icons.js?v=5"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/scenarios.js?v=5"></script>
  <script src="js/gameart.js?v=5"></script>
  <script src="js/process.js?v=5"></script>
  <script src="js/teacher.js?v=5"></script>
  <script src="js/student.js?v=5"></script>
  <script src="js/game.js?v=5"></script>
  <script src="js/site.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
